<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DepSync — Aktivasi Premium</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #eef2ff; color: #0f172a; }
    pre, code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .box { background: #fff; border: 2px solid #0f172a; box-shadow: 4px 4px 0 #0f172a; border-radius: 16px; }
    .btn { border: 2px solid #0f172a; box-shadow: 2px 2px 0 #0f172a; }
    .btn:active { transform: translate(2px, 2px); box-shadow: none; }
  </style>
</head>
<body class="min-h-screen pb-16">
  <header class="sticky top-0 z-20 bg-white border-b-2 border-slate-900">
    <div class="max-w-2xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2 font-extrabold text-base">
        <span class="w-8 h-8 rounded-lg bg-amber-300 border-2 border-slate-900 flex items-center justify-center">D</span>
        <span>DEPSYNC</span>
      </div>
      <span class="px-3 py-1 rounded-full bg-slate-100 border border-slate-300 text-xs font-semibold">
        Limit: <strong id="limitVal">3</strong>
      </span>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 pt-5 space-y-5">
    <div class="box p-4 space-y-4">
      <h1 class="text-2xl font-extrabold text-blue-600">AKTIVASI PREMIUM</h1>
      <div class="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl border-2 border-slate-900 text-xs font-extrabold">
        <button id="tSend" onclick="tab('send')" class="py-2 rounded-lg bg-slate-900 text-amber-300">1 · KIRIM LINK</button>
        <button id="tVer" onclick="tab('ver')" class="py-2 rounded-lg bg-white text-slate-900">2 · VERIFIKASI</button>
      </div>

      <div>
        <label class="block text-xs font-bold mb-1">X-APIKEY (Lokal)</label>
        <input id="keyInp" type="password" oninput="saveKey()" placeholder="Tempel x-apikey..." class="w-full px-3 py-2 rounded-xl border-2 border-slate-900 text-sm font-mono" />
      </div>

      <div id="pSend" class="space-y-3">
        <div>
          <label class="block text-xs font-bold mb-1">ALAMAT GMAIL</label>
          <input id="mailSend" type="email" placeholder="user@gmail.com" class="w-full px-3 py-2.5 rounded-xl border-2 border-slate-900 text-sm" />
        </div>
        <button id="btnSend" onclick="sendLink()" class="btn w-full py-3 rounded-xl bg-blue-600 text-white font-extrabold text-sm">
          KIRIM MAGIC LINK
        </button>
        <div id="sentBox" class="hidden p-3 rounded-xl bg-amber-200 border-2 border-slate-900 text-xs space-y-2">
          <p id="sentMsg" class="font-semibold"></p>
          <button onclick="toVerify()" class="btn px-3 py-1.5 rounded-lg bg-white font-extrabold">LANJUT VERIFIKASI</button>
        </div>
      </div>

      <div id="pVer" class="hidden space-y-3">
        <div>
          <label class="block text-xs font-bold mb-1">ALAMAT GMAIL</label>
          <input id="mailVer" type="email" placeholder="user@gmail.com" class="w-full px-3 py-2.5 rounded-xl border-2 border-slate-900 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-bold mb-1">MAGIC LINK DARI EMAIL</label>
          <input id="linkVer" type="url" placeholder="https://..." class="w-full px-3 py-2.5 rounded-xl border-2 border-slate-900 text-sm" />
        </div>
        <button id="btnVer" onclick="verifyLink()" class="btn w-full py-3 rounded-xl bg-amber-300 text-slate-900 font-extrabold text-sm">
          VERIFIKASI & AKTIFKAN
        </button>
        <div id="verBox" class="hidden p-3 rounded-xl bg-emerald-200 border-2 border-slate-900 text-xs space-y-2">
          <p id="verMsg" class="font-semibold"></p>
          <button onclick="resetAll()" class="btn px-3 py-1.5 rounded-lg bg-white font-extrabold">RESET</button>
        </div>
      </div>
    </div>

    <div class="box overflow-hidden">
      <div class="px-4 py-2 border-b-2 border-slate-900 flex justify-between items-center text-xs font-mono font-bold">
        <span>AM_TERMINAL.LOG</span>
        <button onclick="copyLog()" class="btn px-2 py-0.5 rounded bg-white">SALIN</button>
      </div>
      <pre id="logOut" class="p-4 bg-slate-950 text-slate-100 text-xs whitespace-pre-wrap">[SYSTEM] Siap digunakan.</pre>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
  </html>
